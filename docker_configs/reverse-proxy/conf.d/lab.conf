# --------------------------------------------------
# Enterprise NOC — Reverse Proxy
# Public configuration example
# --------------------------------------------------

# Corporate Portal
server {
    listen 80 default_server;
    listen 443 ssl default_server;

    server_name portal.noc.example.test _;

    location / {
        proxy_pass http://site-estatico:80;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Zabbix
server {
    listen 80;
    listen 443 ssl;

    server_name zabbix.noc.example.test;

    location / {
        proxy_pass http://zabbix-web:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}

# Grafana
server {
    listen 80;
    listen 443 ssl;

    server_name grafana.noc.example.test;

    location / {
        proxy_pass http://grafana:3000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

