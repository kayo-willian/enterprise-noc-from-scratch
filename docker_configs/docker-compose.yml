services:
  db:
    image: mariadb:11.4
    container_name: zabbix-db
    restart: always
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_bin
      - --innodb-buffer-pool-size=512M
      - --max-connections=300
    environment:
      MYSQL_DATABASE: "${ZABBIX_DB_NAME:-zabbix}"
      MYSQL_USER: "${ZABBIX_DB_USER:-zabbix}"
      MYSQL_PASSWORD: "${ZABBIX_DB_PASSWORD:?Set ZABBIX_DB_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD}"
    volumes:
      - ./zabbix-db-data:/var/lib/mysql
    networks:
      - zabbix-net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  zabbix-server:
    image: zabbix/zabbix-server-mysql:ubuntu-7.0-latest
    container_name: zabbix-server
    restart: always
    ports:
      - "10051:10051"
    environment:
      DB_SERVER_HOST: db
      MYSQL_DATABASE: "${ZABBIX_DB_NAME:-zabbix}"
      MYSQL_USER: "${ZABBIX_DB_USER:-zabbix}"
      MYSQL_PASSWORD: "${ZABBIX_DB_PASSWORD:?Set ZABBIX_DB_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD}"
      ZBX_SERVER_NAME: Zabbix_Server
      ZBX_STARTPOLLERS: 10
      ZBX_CACHESIZE: 128M
    volumes:
      - ./alertscripts:/usr/lib/zabbix/alertscripts:ro
      - ./externalscripts:/usr/lib/zabbix/externalscripts:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - zabbix-net

  zabbix-web:
    image: zabbix/zabbix-web-apache-mysql:ubuntu-7.0-latest
    container_name: zabbix-web
    restart: always
    ports:
      - "8082:8080"
    environment:
      ZBX_SERVER_HOST: zabbix-server
      ZBX_SERVER_PORT: 10051
      DB_SERVER_HOST: db
      MYSQL_DATABASE: "${ZABBIX_DB_NAME:-zabbix}"
      MYSQL_USER: "${ZABBIX_DB_USER:-zabbix}"
      MYSQL_PASSWORD: "${ZABBIX_DB_PASSWORD:?Set ZABBIX_DB_PASSWORD}"
      ZBX_SERVER_NAME: Zabbix_Server
      PHP_TZ: America/Belem
    depends_on:
      db:
        condition: service_healthy
      zabbix-server:
        condition: service_started
    networks:
      - zabbix-net

  zabbix-agent:
    image: zabbix/zabbix-agent:ubuntu-7.0-latest
    container_name: zabbix-agent
    restart: always
    ports:
      - "10050:10050"
    environment:
      ZBX_HOSTNAME: "Zabbix server"
      ZBX_SERVER_HOST: zabbix-server
      ZBX_PASSIVE_ALLOW: "true"
    networks:
      - zabbix-net

  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      GF_INSTALL_PLUGINS: alexanderzobnin-zabbix-app
    volumes:
      - ./grafana-data:/var/lib/grafana
    networks:
      - zabbix-net

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: always
    ports:
      - "3001:3001"
    volumes:
      - ./uptime-kuma-data:/app/data
    networks:
      - zabbix-net

  reverse-proxy:
    image: nginx:alpine
    container_name: reverse-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./reverse-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./reverse-proxy/conf.d:/etc/nginx/conf.d:ro
      - ./reverse-proxy/certs:/etc/nginx/certs:ro
    networks:
      - zabbix-net
     depends_on:
      - zabbix-web
      - grafana
      - uptime-kuma
      - site-estatico

    site-estatico:
    image: httpd:alpine
    container_name: site-estatico
    restart: always
    ports:
      - "8081:80"
    volumes:
      - ./site-estatico-html:/usr/local/apache2/htdocs:ro
    networks:
      - zabbix-net

networks:
  zabbix-net:
    driver: bridge
